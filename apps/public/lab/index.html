<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#11100e"><title>薯薯求生 · 摄影学英语</title></head>
<body>
  <section id="lab-boot" role="status" style="position:fixed;inset:0;z-index:9999;background:#11100e;color:#eee;--boot-bg:#11100e;--boot-ink:#eee;display:grid;place-content:center;gap:clamp(10px,2.5vh,16px);text-align:center;padding:24px;font:16px system-ui"><h1>薯薯求生</h1><p id="lab-boot-message">正在加载游戏页面…</p><progress id="lab-boot-progress" aria-label="游戏加载进度"></progress><div class="boot-game" aria-hidden="true"><!--boot-maze--></div><button hidden onclick="location.reload()">重新加载游戏</button><a href="../#/settings" style="color:inherit">返回实验室</a></section>
  <style>#lab-boot[hidden],#lab-boot progress[hidden]+.boot-game{display:none}#lab-boot .boot-game{display:grid;place-items:center;max-width:100%}#lab-boot progress{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}</style>
  <div class="game-shell">
    <header class="topbar"><button id="exit" class="quiet" aria-label="返回实验室">‹ 实验室</button><div class="game-title"><span class="tiny-potato" aria-hidden="true">●</span><strong>薯薯求生</strong><span class="beta">实验中</span></div><div class="topbar-actions"><button id="pause" class="quiet" hidden>暂停</button></div></header>
    <section class="user-level-meter" aria-label="应用等级进度"><strong id="user-level-label">LV0</strong><div class="user-level-track" aria-hidden="true"><i id="user-level-fill"></i></div><span id="user-level-detail">0 / 2 · 0 经验</span></section>
    <main class="layout">
      <section class="arena-wrap" aria-label="游戏区域">
        <div class="hud"><div class="health"><span aria-hidden="true">♥</span><div class="health-track"><i id="health-fill"></i></div><b id="health-value">30 / 30</b></div><div class="wave"><strong id="wave">第 1 波</strong><span id="time">准备出发</span></div><div class="materials"><span class="coin-art" aria-hidden="true"></span><b id="coins">0</b></div></div>
        <div id="stage" class="stage"><canvas id="arena" role="img" aria-label="薯薯求生战场，使用方向键或触摸摇杆移动"></canvas><div id="screen" class="screen"></div><div id="joystick" class="joystick" aria-hidden="true"><i id="stick"></i></div><div id="wave-toast" class="wave-toast" role="status"></div></div>
        <div class="arena-footer"><span id="controls-tip">方向键 / WASD 移动 · 自动攻击</span><div class="xp"><span id="level">LV 1</span><div><i id="xp-fill"></i></div></div></div>
      </section>
      <aside class="sidebar"><div class="side-label">这一次的冒险</div><h2>小土豆，大勇气。</h2><p class="intro">在怪物包围中坚持下来，<br>用你认识的单词换一身好装备。</p><div class="stat-grid"><div><small>攻击</small><b id="damage">7</b></div><div><small>护甲</small><b id="armor">0</b></div><div><small>击败</small><b id="kills">0</b></div><div><small>拼对</small><b id="correct">0</b></div></div><div class="side-label equipment-label">随身武器 <span id="weapon-count">1 / 6</span></div><div id="weapons" class="weapons"></div><div class="side-label equipment-label">口袋里的好东西</div><div id="items" class="items"><span class="empty">出发后到商店挑选</span></div><p class="aside-note">每波结束，休整并购买装备。<br>走得再远一点，也多认识一个词。</p></aside>
    </main>
  </div>
  <dialog id="spelling" class="spelling-dialog" aria-labelledby="spell-title"><div class="modal-top"><span class="side-label">拼对就能带走</span><button id="spell-cancel" class="quiet" aria-label="暂时返回商店">×</button></div><div class="purchase-heading"><span id="purchase-icon" class="purchase-icon" aria-hidden="true"></span><div><h2 id="spell-title"></h2><span id="purchase-price"></span></div></div><section class="learning-spelling"><div class="spell-reference"><div id="spell-photo" class="spell-photo" hidden><img id="spell-photo-image" draggable="false" alt=""><span id="spell-photo-focus" class="spell-photo-focus" aria-hidden="true" hidden></span></div><div class="learning-hint"><div class="meaning-copy"><h3 id="meaning"></h3><span id="phonetic"></span></div><button id="hear-word" type="button" aria-label="朗读单词" title="朗读单词"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M15.5 8.7a4.6 4.6 0 0 1 0 6.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div><div class="learning-examples" aria-label="例句，可横向滚动"><span id="example"></span><span id="example-zh"></span></div></div><div class="spell-work"><div id="answer-board" class="answer-board" role="group" aria-label="拼写答案"><div id="letter-board" class="letters"></div></div><div id="letter-bank" class="letter-bank" role="group" aria-label="字母方块"></div><div class="spell-controls"><div class="spell-actions"><button id="skip-spelling" type="button" class="secondary experience-skip">消耗经验跳过</button></div></div><p id="spell-feedback" role="status" aria-live="polite"></p></div></section></dialog>
  <dialog id="rotate-device" class="rotation-dialog" aria-labelledby="rotate-title"><div class="rotation-copy"><svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true"><rect x="12" y="24" width="56" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 12a30 30 0 0 1 39 4m0-9v9h-9M56 68a30 30 0 0 1-39-4m0 9v-9h9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><h2 id="rotate-title">横拿手机，开始冒险</h2><p>双手握持，移动更轻松。</p><button id="rotation-exit" class="secondary" type="button">返回实验室</button></div></dialog>
  <div id="spell-particles" class="spell-particles" popover="manual" aria-hidden="true"></div>
  <div id="notification" class="notification" role="status" hidden></div>
  <script type="module" src="/src/lab-entry.ts"></script>
</body></html>
