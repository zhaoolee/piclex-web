name: User-authorized autosync release 2026-11-08
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-production
  cancel-in-progress: false
env:
  REVISION: 9e22eb2fced397468ae32f131a9aa815519a6512
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch the exact user-authorized artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download autosync-20261108-9e22eb2 --repo zhaoolee/piclex-web --pattern piclex-autosync-9e22eb2.tar.gz --dir candidate
          echo '9853c981797224b0f08ec95cc61b354c983c901356e2238015af85bd9c94f82e  candidate/piclex-autosync-9e22eb2.tar.gz' | sha256sum --check
          mkdir dist
          tar -xzf candidate/piclex-autosync-9e22eb2.tar.gz -C dist
          node scripts/prepare-verified-image.mjs dist "$RUNNER_TEMP/autosync-image" "$REVISION"
          echo 'User requested release after disclosure of two remaining desktop performance failures. This is NOT a performance pass.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check the packaged container before publication
        run: |
          docker build -t piclex-autosync:verify "$RUNNER_TEMP/autosync-image"
          docker run -d --name piclex-autosync-check --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:18121:8080 piclex-autosync:verify
          trap 'docker rm -f piclex-autosync-check' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18121/healthz; then break; fi
            sleep 1
          done
          node scripts/test-docker.mjs http://127.0.0.1:18121
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: pages
      - name: Verify live Pages version and every application asset
        run: node scripts/verify-live-release.mjs https://zhaoolee.com/piclex-web/ "$REVISION" dist/release.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the same assets for AMD64 and ARM64
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/autosync-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/piclex-web:sha-9e22eb2
          labels: org.opencontainers.image.revision=9e22eb2fced397468ae32f131a9aa815519a6512
      - name: Verify image identity and promote latest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/piclex-web
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node -e 'require("fs").writeFileSync("image-receipt.json",JSON.stringify({sourceRevision:process.env.REVISION,image:process.env.IMAGE,digest:process.env.DIGEST}))'
          node scripts/promote-verified-image.mjs image-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autosync-release-receipt
          path: image-receipt.json
