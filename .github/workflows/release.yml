name: Release verified build
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA of the verified release candidate
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://zhaoolee.com/piclex-web/
    steps:
      - name: Use the protected production workflow
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests/fixtures/demo/decks
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the exact fully verified candidate
        id: verified
        run: node scripts/find-performance-artifact.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
          REQUIRE_READY_RELEASE: 'true'
      - uses: actions/download-artifact@v4
        with:
          pattern: '{release-manifest,verified-image}'
          merge-multiple: true
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified.outputs.run-id }}
      - name: Require the runner Chrome and registry-only Buildx client
        run: |
          /opt/google/chrome/chrome --version
          docker buildx version
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Deploy, promote and verify the same immutable candidate
        run: node scripts/release-verified-build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
          VERIFIED_RUN_ID: ${{ steps.verified.outputs.run-id }}
          REVISION: ${{ inputs.revision }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/piclex-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-timing
          path: release-timing.json
          if-no-files-found: ignore
