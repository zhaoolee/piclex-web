name: Release verified build
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA of the verified release candidate
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  ready:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.verified.outputs.run-id }}
    steps:
      - name: Use the protected production workflow
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the exact fully verified candidate
        id: verified
        run: node scripts/find-performance-artifact.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
          REQUIRE_READY_RELEASE: 'true'
  pages:
    needs: ready
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install chrome
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.ready.outputs.run-id }}
      - name: Verify the exact candidate bytes without rebuilding
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          mkdir dist
          tar -xf candidate/artifact.tar -C dist
          node scripts/prepare-verified-image.mjs dist "$RUNNER_TEMP/verified-context" "$REVISION"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the live release and application assets
        env:
          REVISION: ${{ inputs.revision }}
        run: node scripts/verify-live-release.mjs https://zhaoolee.com/piclex-web/ "$REVISION" dist/release.json --smoke
  docker:
    needs: ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-image
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.ready.outputs.run-id }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote and verify the immutable tested image
        env:
          REVISION: ${{ inputs.revision }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/piclex-web
        run: node scripts/promote-verified-image.mjs candidate/verified-image.json
