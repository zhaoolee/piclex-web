name: Check and publish
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "memory/**", "README.md", "ASSET_LICENSES.md", "deploy/README.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - id: scope
        run: node scripts/ci-release-scope.mjs
      - run: npm ci
      - run: npm run decks:build && git diff --exit-code -- tests/fixtures/demo
      - run: npm test
      - run: npm run test:deploy
      - uses: actions/cache@v4
        with:
          path: .cache/piclex-content
          key: public-content-${{ hashFiles('content/snapshot.json') }}
          restore-keys: public-content-
      - run: npm run content:build
        env:
          PICLEX_CONTENT_CACHE: .cache/piclex-content
      - run: npm run build
      - run: node scripts/write-public-release-manifest.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  browser:
    name: Browser ${{ matrix.project }} ${{ matrix.shard }}/2
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile, mobile-webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Restore the single built artifact and test fixtures
        run: |
          mkdir dist
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C dist
          ln -s "$PWD/dist/library" apps/public/public/library
      - name: Use responsive Ubuntu package mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ] && grep -q 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps ${{ matrix.project == 'mobile-webkit' && 'webkit' || 'chrome' }}
      - run: npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --reporter=line,blob
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results/
            blob-report/
  performance:
    name: Performance release gate
    needs: build
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/pages-artifact
      - name: Restore the exact candidate
        run: |
          mkdir dist
          tar -xf /tmp/pages-artifact/artifact.tar -C dist
      - run: npx playwright install chrome
      - name: Measure continuous learning and automatic backup
        run: npm run test:performance -- --dist dist --source "$GITHUB_SHA" --output performance-results --channel chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: performance-results/
  docker:
    needs: [build, browser, performance]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-publish.yml
    with:
      verified-artifact: true
      performance-verified: true
      publish: ${{ needs.build.outputs.publish == 'true' }}
    secrets: inherit
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: [build, browser, performance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
