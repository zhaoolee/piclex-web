name: Check release candidate
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "memory/**", "README.md", "ASSET_LICENSES.md", "deploy/README.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      full-browser:
        description: Run all browser tests instead of reusing unchanged baseline coverage
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      performance: ${{ steps.scope.outputs.performance }}
      browser-scope: ${{ steps.browser-scope.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - id: browser-scope
        run: node scripts/browser-test-scope.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_BROWSER: ${{ inputs.full-browser || false }}
      - uses: actions/upload-artifact@v4
        with:
          name: browser-scope
          path: browser-scope.json
      - id: scope
        run: node scripts/ci-release-scope.mjs
      - run: npm ci
      - run: npm run decks:build && git diff --exit-code -- tests/fixtures/demo
      - run: npm test
      - run: npm run test:deploy
      - uses: actions/cache@v4
        with:
          path: .cache/piclex-content
          key: public-content-${{ hashFiles('content/snapshot.json') }}
          restore-keys: public-content-
      - run: npm run content:build
        env:
          PICLEX_CONTENT_CACHE: .cache/piclex-content
      - run: npm run build
      - run: node scripts/write-public-release-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: dist/release.json
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7
  browser:
    name: Browser ${{ matrix.project }} ${{ matrix.shard }}/2
    needs: build
    runs-on: ubuntu-latest
    env:
      BROWSER_SCOPE: ${{ needs.build.outputs.browser-scope }}
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile, mobile-webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: fromJSON(needs.build.outputs.browser-scope).mode != 'reuse'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: fromJSON(needs.build.outputs.browser-scope).mode != 'reuse'
      - uses: actions/download-artifact@v4
        if: fromJSON(needs.build.outputs.browser-scope).mode != 'reuse'
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Restore the single built artifact and test fixtures
        if: fromJSON(needs.build.outputs.browser-scope).mode != 'reuse'
        run: |
          mkdir dist
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C dist
          ln -s "$PWD/dist/library" apps/public/public/library
      - name: Bound Ubuntu package mirror requests
        if: fromJSON(needs.build.outputs.browser-scope).mode != 'reuse'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            # Keep signed Ubuntu packages while using the mirror that responded
            # during the stalled archive.ubuntu.com install.
            sudo sed -Ei 's#https?://(azure\.)?archive\.ubuntu\.com/ubuntu#https://security.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' 'Acquire::Retries "1";' \
            | sudo tee /etc/apt/apt.conf.d/99-piclex-ci-network >/dev/null
      - run: npx playwright install --with-deps ${{ matrix.project == 'mobile-webkit' && 'webkit' || 'chrome' }}
        if: fromJSON(needs.build.outputs.browser-scope).mode != 'reuse'
        timeout-minutes: 5
      - run: node scripts/browser-test-scope.mjs --run --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --reporter=line,blob
      - uses: actions/upload-artifact@v4
        if: always() && fromJSON(needs.build.outputs.browser-scope).mode != 'reuse'
        with:
          name: browser-results-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results/
            blob-report/
  performance-shards:
    name: Measure ${{ matrix.viewport }} ${{ matrix.scenario }}
    needs: build
    if: needs.build.outputs.performance == 'true'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, touch]
        scenario: [spelling, dictation, modules, sync]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/pages-artifact
      - name: Restore the exact candidate
        run: |
          mkdir dist
          tar -xf /tmp/pages-artifact/artifact.tar -C dist
      - run: npx playwright install chrome
      - name: Measure continuous learning and automatic backup
        run: npm run test:performance -- --dist dist --source "$GITHUB_SHA" --output performance-results --channel chrome --shard ${{ matrix.viewport }}/${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.viewport }}-${{ matrix.scenario }}
          path: performance-results/
  performance:
    name: Performance release gate
    needs: [build, performance-shards]
    if: always() && needs.build.outputs.performance == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent measurement
        env:
          RESULT: ${{ needs.performance-shards.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          path: shards
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: candidate
      - name: Verify complete same-version coverage from raw traces
        run: node scripts/performance-shards.mjs shards performance-results "$GITHUB_SHA" candidate/release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: performance-results/
  docker:
    needs: [build, browser, performance]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-publish.yml
    with:
      verified-artifact: true
      performance-verified: true
      candidate-only: true
      publish: ${{ needs.build.outputs.publish == 'true' }}
    secrets: inherit
