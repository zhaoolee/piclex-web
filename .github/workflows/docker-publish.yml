name: Publish Docker image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      verified-artifact:
        type: boolean
        default: false
      performance-verified:
        type: boolean
        default: false
      publish:
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_CONTEXT: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the caller performance gate
        if: ${{ inputs.verified-artifact && !inputs.performance-verified }}
        run: exit 1
      - name: Find the exact previously verified artifact
        if: ${{ !inputs.verified-artifact }}
        id: verified
        run: node scripts/find-performance-artifact.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.verified-artifact }}
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified.outputs.run-id }}
      - uses: actions/download-artifact@v4
        if: inputs.verified-artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Prepare verified image without rebuilding the application
        run: |
          mkdir dist
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C dist
          node scripts/prepare-verified-image.mjs dist "$RUNNER_TEMP/verified-image" "$GITHUB_SHA"
          echo "IMAGE_CONTEXT=$RUNNER_TEMP/verified-image" >> "$GITHUB_ENV"
      - name: Check Docker Hub configuration
        if: ${{ !inputs.verified-artifact || inputs.publish }}
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$USERNAME" && test -n "$TOKEN" || { echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.'; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          load: true
          platforms: linux/amd64
          tags: piclex-web:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container and bundled content
        run: |
          docker run -d --name piclex-verify --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:18121:8080 piclex-web:verify
          trap 'docker logs piclex-verify; docker rm -f piclex-verify' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18121/healthz; then break; fi
            sleep 1
          done
          node scripts/test-docker.mjs http://127.0.0.1:18121
      - uses: docker/login-action@v3
        if: ${{ !inputs.verified-artifact || inputs.publish }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: ${{ !inputs.verified-artifact || inputs.publish }}
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/piclex-web
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Publish AMD64 and ARM64
        if: ${{ !inputs.verified-artifact || inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
